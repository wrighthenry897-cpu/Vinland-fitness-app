services:
  - type: web
    name: vinland
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/vinland.sqlite3
    disk:
      name: vinland-data
      mountPath: /var/data
      sizeGB: 1
