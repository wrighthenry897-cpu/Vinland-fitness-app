<div class="movement-demo">
  <div class="movement-demo-canvas">
    <img
      class="exercise-demo-photo exercise-demo-sequence"
      src="{{ url_for('static', filename='exercise-demos/' ~ exercise['demo_id'] ~ '/0.jpg') }}"
      data-next-frame="{{ url_for('static', filename='exercise-demos/' ~ exercise['demo_id'] ~ '/1.jpg') }}"
      data-exercise-name="{{ exercise['name'] }}"
      data-first-position="{% if exercise['demo_id'] == 'Bird_Dog' %}first-side reach{% else %}starting{% endif %}"
      data-second-position="{% if exercise['demo_id'] == 'Bird_Dog' %}opposite-side reach{% else %}finishing{% endif %}"
      data-first-label="{% if exercise['demo_id'] == 'Bird_Dog' %}SIDE 1{% else %}START{% endif %}"
      data-second-label="{% if exercise['demo_id'] == 'Bird_Dog' %}SIDE 2{% else %}FINISH{% endif %}"
      data-current-frame="0"
      alt="{{ exercise['name'] }} {% if exercise['demo_id'] == 'Bird_Dog' %}first-side reach{% else %}starting position{% endif %}"
      loading="lazy"
      decoding="async"
    >
    <span class="demo-live"><i></i> MOVEMENT SEQUENCE</span>
    <output class="demo-frame-count" aria-live="polite"><span class="demo-frame-number">01</span><span class="demo-frame-label">START</span></output>
    <div class="demo-controls">
      <button class="demo-step" type="button" aria-label="Show the finishing position">↔</button>
      <button class="demo-toggle" type="button" aria-pressed="false" aria-label="Pause movement demo" title="Pause movement demo">Ⅱ</button>
    </div>
  </div>
  <p class="demo-caption"><span>↻</span>{% if exercise['demo_id'] == 'Bird_Dog' %}Alternate opposite-side reaches · pause or step through the demo.{% else %}Starting and finishing positions · pause or step through the demo.{% endif %}</p>
</div>
